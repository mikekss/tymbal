name: ci

on:
  push:
    branches: [main, n6-instrument]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests against the Python golden references
        run: make -C fw test

  qemu-ck4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm python3-numpy
      - name: CK4 through the MVE branches on a Cortex-M55 model
        run: make -C fw qemu-ck4
